<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workstream canvas - Holistics</title>
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="refresh" content="0; url=https://holistics-canvas.aanandambaba.workers.dev/">
    <link rel="canonical" href="https://holistics-canvas.aanandambaba.workers.dev/">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script>window.location.replace('https://holistics-canvas.aanandambaba.workers.dev/');</script>
    <style>
        :root {
            --bg: #fafafa;
            --fg: #070708;
            --muted: #4f535b;
            --line: #e4e6ea;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
            background: var(--bg);
            color: var(--fg);
            font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            font-size: 17px;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
        }
        main { max-width: 30rem; }
        h1 { font-size: 1.5rem; line-height: 1.25; margin: 0 0 10px; letter-spacing: -0.01em; }
        p { margin: 0 0 24px; color: var(--muted); }
        a.btn {
            display: inline-block;
            padding: 13px 22px;
            border: 1px solid var(--fg);
            border-radius: 4px;
            background: var(--fg);
            color: var(--bg);
            font-weight: 600;
            font-size: 16px;
            text-decoration: none;
        }
        a.btn:hover { background: transparent; color: var(--fg); }
        a.btn:focus-visible { outline: 3px solid #ffd100; outline-offset: 2px; }
        .sig { margin: 28px 0 0; padding-top: 18px; border-top: 1px solid var(--line); font-size: 14px; }
    </style>
</head>
<body>
    <main>
        <h1>Workstream canvas</h1>
        <p>We are taking you to the form now. If nothing happens in the next few seconds, open it here.</p>
        <p><a class="btn" href="https://holistics-canvas.aanandambaba.workers.dev/">Open the canvas</a></p>
        <p class="sig">Your answers save in your browser as you go, so you can come back and finish later.</p>
    </main>
</body>
</html>
